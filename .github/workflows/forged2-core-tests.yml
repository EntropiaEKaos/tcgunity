name: FORGED 2 Core Tests
on:
  push:
    branches:
      - feat/forged-2-foundation
      - feat/graveyard-recovery-safe
  pull_request:
    paths:
      - 'Scripts/GameLogic/ForgedActionStack.cs'
      - 'Editor/ForgedActionStackTests.cs'
      - 'Tests/Forged2.Core.Tests/**'
      - '.github/workflows/forged2-core-tests.yml'
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run NUnit core tests
        run: dotnet test Tests/Forged2.Core.Tests/Forged2.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=forged2-core.trx" --results-directory TestResults
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forged2-core-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
